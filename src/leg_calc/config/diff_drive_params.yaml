leg_calc_diff_drive:
  ros__parameters:
    # ---------------- 底盘几何（必须与 usb_drive 的同一组参数一致） ----------------
    wheel_separation: 0.20    # L：左右轮间距 [m]
    wheel_radius: 0.065       # r：轮半径 [m]

    # ---------------- 限幅 ----------------
    max_linear: 1.0           # |v| 限幅 [m/s]，<=0 不限
    max_angular: 3.0          # |ω| 限幅 [rad/s]，<=0 不限
    max_wheel_speed: 20.0     # 单轮角速度限幅 [rad/s]，<=0 不限；不要超过 usb_drive 的 max_wheel_omega

    # ---------------- 指令与发布 ----------------
    cmd_velocity_timeout: 0.3  # cmd_vel 中断多久后左右轮目标转速置零 [s]
    publish_rate: 50.0         # /wheel_target 发布频率 [Hz]
    cmd_vel_topic: cmd_vel
    wheel_target_topic: wheel_target
