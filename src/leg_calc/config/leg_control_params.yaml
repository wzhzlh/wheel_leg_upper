leg_control:
  ros__parameters:
    # ================= 500 Hz 统一控制环 =================
    # 一个周期内顺序完成：状态快照 → 状态机 → Pitch LQR → 双 VMC → 轮子分配
    control_rate: 500.0              # 控制环频率 [Hz]
    debug_rate: 100.0                # 调试类输出频率 [Hz]：/odom + TF + /leg_control/state
                                     #   控制环仍跑 control_rate，但这三条 500 Hz 发布会把单线程
                                     #   executor 与订阅端（rviz2 / topic echo）拖垮，日志表现为
                                     #   “控制环最坏执行时间 xx ms 超过 2 ms 周期”。0 = 不发布

    # ---------------- 控制线程调度优先级 ----------------
    # 500 Hz = 2 ms 周期，普通 CFS 线程被同机编译/IDE/浏览器抢时间片就是 ms~十 ms 抖动，
    # 一次 >100 ms 的抖动会让 IMU/关节/轮反馈同时超时 → 故障字 0x23 停机。
    rt_priority: 60                  # SCHED_FIFO 优先级（1~99）；0 = 不用 FIFO。
                                     #   需要 CAP_SYS_NICE：sudo setcap cap_sys_nice+ep <可执行文件>
                                     #   或 /etc/security/limits.conf 加 "<user> - rtprio 80"
    rt_nice: -10                     # SCHED_FIFO 不可用时的退路（per-thread nice，0 = 不调）；
                                     #   同样需要权限，失败只打一条 WARN，不影响运行

    # ---------------- 机器人物理参数 ----------------
    # 以下数值全部由 src/model/model/wheel_leg.urdf 推导（home 姿态）。
    # home 姿态取 MJCF keyframe "home"：两轮轴等高（差 0.15 mm）的站立零位；
    # 注意 URDF 关节零位左右不对称，home 时右腿并非全零（rf1=-0.2259, rf2=0.3339），
    # 直接用 q=0 会得到两轮高度差 13.6 mm 的错误姿态（大质量 base 的质心不受影响，
    # 但轮轴高度会被算成 0.0254，h 偏大到 0.0895）。
    cart_mass: 0.285                 # M：两轮质量之和 [kg]（lefoot 0.130114 + rifoot 0.155050）
    pendulum_mass: 1.904             # m：腿 + 机身（摆杆）质量 [kg]（base 1.667452 + 4 曲柄 0.077208 + 4 连杆 0.159329）
    com_length: 0.0343               # h：home 姿态摆杆质心到轮轴距离 [m]
                                     # 2026-11-01 换 URDF 关节零位后实测：摆杆质心 z 0.06621 − 轮轴 z 0.031909 = 0.0343
                                     # （旧零位是 0.0834，新零位是深蹲姿，站立靠 com_height 指令把腿撑开）
    com_inertia: 0.001793            # I：摆杆绕自身质心 pitch 惯量 [kg·m²]（绕轮轴 4.033e-3 减去 m·h²）
    gravity: 9.81                    # g：重力加速度 [m/s²]
    wheel_radius: 0.030              # r：轮半径 [m]（接触圆柱半径 0.032；两轮静态高度差 3.98 mm）
    wheel_inertia: 0.0000421         # Jw：两轮绕轮轴等效转动惯量 [kg·m²]（MJCF 两轮 Iyy 之和 4.213e-5）
    input_mode: wheel_torque         # 控制输入定义：wheel_torque（轮轴力矩，N·m）/ force（轮轴等效力，N）

    # ---------------- LQR 权重与增益调度（四状态：x, θ, ẋ, θ̇） ----------------
    # 四个状态的来源（已逐项核对）：
    #   x   = 0.5·(angle_L + angle_R)·r   轮端多圈绝对转角 × 轮半径 [m]，正 = 前进
    #   ẋ   = 0.5·(w_L + w_R)·r           轮端角速度 × 轮半径 [m/s]（固件已 ÷36 减速比、乘 dir）
    #   θ   = IMU 四元数 ZYX → pitch − theta_offset [rad]，正 = 前倾
    #   θ̇   = IMU angular_velocity.y [rad/s]，与 θ 同轴
    # 注意 x 没有起点锚定（轮子转几米后 x 就是几米），所以 computeBalanceTorque 里
    # ref(kX)/ref(kXdot) 恒跟随实测（误差 0）：LQR 只做姿态，行驶/转向由轮子分配层的
    # k_vel_p / k_yaw_p 负责。若把 x 当位置误差，u 会立刻顶到 u_max（实测 x=-27 m 时
    # 位置项 31.8、姿态项 0.07，轮子永远饱和）。
    # Q/R 设计：R=36 是有意保留的余量（等效把 K 缩到 1/6）。
    #   q=[50,500,10,1], R=36  → K≈[-1.18, -5.22, -1.17, -0.33]，极点 -111/-21.8/-1.41±1.01j
    #   q=[50,500,10,1], R=1   → K≈[-7.07, -27.2, -6.94, -1.74]，θ 到 0.9° 就饱和（bang-bang）
    # h∈[0.06,0.12] 内 K 变化 <3%，online_lqr 的缓存阈值已放宽到 2 mm，不会每周期重算。
    q_diag: [50.0, 500.0, 10.0, 1.0]  # 状态权重 Q 对角，顺序 [x, theta, x_dot, theta_dot]
    r_weight: 36.0                   # 控制权重 R（1x1 标量）
    gain_mode: quadratic  # [test override]
    k_coeffs: [                      # 仅 quadratic 模式使用，保留作对照；行 = [k_x, k_theta, k_x_dot, k_theta_dot]
      0.0, 0.0, -1.18,
      0.0, 0.0, -5.22,
      0.0, 0.0, -1.17,
      0.0, 0.0, -0.33
    ]
    # ---------------- 五杆足端 -> 质心高度：h = 足端_y + com_offset ----------------
    thigh: 0.15                      # [参考] 串联模型大腿长度 l1 [m]（URDF 无双连杆串联腿，主链路已改用五杆，仅单测用）
    shank: 0.15                      # [参考] 串联模型小腿长度 l2 [m]（同上）
    com_offset: -0.0289              # home 姿态摆杆质心在髋轴下方 [m]（2026-11-01 实测：髋 z 0.09514 − 质心 z 0.06621）
    h_min: 0.06                      # LQR 增益调度高度下限 [m]
    h_max: 0.12                      # LQR 增益调度高度上限 [m]
    use_measured_height: true        # 是否用关节角实测 h（false 则恒用 com_length 名义值）
    height_timeout: 0.50             # 关节反馈年龄超过该值就退回 com_length [s]

    # ---------------- Pitch 姿态来源 ----------------
    theta_axis: pitch                # 姿态轴：pitch / roll
    theta_offset: 0.0                # IMU 安装零位 [rad]：imu_site 与基座同向，静置 pitch ≈ 0
    u_max: 0.40  # [test override]
                                     #   固件电流能力 16000 counts ÷ 4500 = 3.56 N·m/轮（task.c），
                                     #   1.0 N·m 无硬件压力；留 2/3 余量给差速与偏航。
                                     #   两者不一致时 LQR 会在"假线性"区工作（输出被后端截平）。

    # ---------------- 五杆腿 VMC（两条腿共用几何，各自独立状态） ----------------
    l1: 0.050                        # O→A 前摆臂长度 [m]（URDF |lf_joint1→lf_joint2| = 0.0500，左右一致）
    l2: 0.105                        # A→B 前连杆长度 [m]（URDF lf_joint2→轮轴 平面投影 = 0.1050，左右一致）
    l3: 0.105                        # C→B 后连杆长度 [m]（URDF 闭链 |C-B| = 0.1052，取标称 0.105）
    l4: 0.050                        # D→C 后摆臂长度 [m]（URDF |lb_joint1→lb_joint2| = 0.0500）
    l5: 0.060                        # O→D 两髋关节间距 [m]（URDF 前后髋 origin x 差 0.060000）
    foot_branch: 1                   # 正运动学装配分支：+1 足端在 A→C 连线下方，-1 取上方
    front_branch: 1                  # 逆运动学前肘分支：+1 前肘 A 在 O→B 连线左侧，-1 取右侧
    rear_branch: 1                   # 逆运动学后肘分支：+1 后肘 C 在 D→B 连线右侧，-1 取左侧

    # kp/kd 按 ζ = kd / (2·√(kp·m_eq)) 配对（m_eq 取单腿等效质量 ≈ 0.56 kg）：
    #   x 轴：kp=300 → kd=22 给 ζ≈0.85（kd=15 只有 0.58，欠阻尼、前后晃）
    #   y 轴：kp=2500 → kd=70 给 ζ≈0.65（撑住整机重量，带宽 √(2kp_y/m)/2π ≈ 8 Hz）
    kp_x: 70.0  # [test override]
    kp_y: 600.0  # [test override]
    kd_x: 4.0  # [test override]
    kd_y: 40.0  # [test override]
    force_max_x: 40.0  # [test override]
    force_max_y: 150.0               # 足端上下力限幅 [N]：重力前馈 ~9.3 N + 弹簧量，余量充足
    vmc_gravity_comp: false  # [test override]
    foot_target_x: 0.0314            # 足端前后目标位置 [m]（两髋中点 l5/2=0.03，按新零位实测 0.0314；y 由质心高度指令决定）
    joint_torque_max: 8.0            # 单关节力矩限幅 [N·m]
    joint_torque_sign: [1.0, 1.0, 1.0, 1.0]  # 四关节力矩符号 [左髋, 左膝, 右髋, 右膝]，方向反了改成 -1

    # 关节角 → 五杆角标定：α/β = joint_sign·q + joint_offset（顺序同上：左前 α_L、左后 β_L、右前 α_R、右后 β_R）
    # 曲柄在 URDF/MJCF 里的零位并不指向 +x（五杆图里 α=β=0 的方向），必须补偿：
    #   α_L(0)=123.499°、β_L(0)=34.312°、α_R(0)=119.868°、β_R(0)=55.617°
    # 右腿整体绕 x 轴转了 180°，关节轴在 base 系里反向，所以 joint_sign 取 -1。
    # 数值来源：MuJoCo 里量 曲柄髋心→肘心 的平面方向（q=0 与 q=±0.4 线性拟合，斜率恰为 ±1），
    # 残差 1e-3 度；标定后控制器 FK 复算的足端与模型差 < 0.3 mm（teach.md 12.7）。
    # 注意：电控王换 CAD / 换减速器零位后这 8 个数要重测。
    joint_sign: [1.0, 1.0, -1.0, -1.0]
    joint_offset: [-3.0285, -0.1911, -3.0411, -0.1293]  # [rad]
    # 2026-11-01 按新 URDF 零位（lf1 rpy -1.1、lb1 rpy +0.79、rf1 -1.15、rb1 +1.1）重标定：
    # α_L=α(0)=-3.0285、β_L=-0.1911、α_R=-3.0411、β_R=-0.1293；joint_sign 仍为 [+1,+1,-1,-1]
    # 旧值：[2.155471, 0.598858, 2.092103, 0.970701]

    # ---------------- 目标质心高度（上层指令修改，控制环内做斜坡；内部换算 足端_y = h - com_offset） ----------------
    # 注意：foot_y = com_height - com_offset（com_offset 为负，即 foot_y = h + |com_offset|）。
    # 按新 URDF 零位扫过工作空间：foot_x≈0.031 时 foot_y ∈ [0.046, 0.152]，
    # 换算 h ∈ [0.017, 0.123]；再往上曲柄/连杆接近共线（奇异位形）。
    # home 姿态（关节全 0）是深蹲：foot_y = 0.0612、h = 0.0343；站立靠下面的指令把腿撑开。
    com_height_default: 0.0834       # 默认站立目标（换算 foot_y = 0.1123 m，实测 h≈0.067）
    # 上下限来自五杆工作空间（foot_x≈0.031 时 foot_y∈[0.046,0.152] → h∈[0.017,0.123]），
    # 两端各留 ~10 mm 余量避开曲柄/连杆共线的奇异位形：
    #   下限 0.065 → foot_y 0.0939；上限 0.100 → foot_y 0.1289（静止压缩 ~4 mm 后约 0.0965 实测）
    com_height_min: 0.065            # 足端目标 y=0.0939 m（再往下腿折得太深，VMC 雅可比变差）
    com_height_max: 0.100            # 足端目标 y=0.1289 m（约 90% 行程），避开伸直奇异位形
    com_height_rate: 0.50            # 腿长指令斜坡 [m/s]，与三级频率匹配：
                                     #   控制 500 Hz → 1.0 mm/周期；下发 200 Hz → 2.5 mm/帧；固件 250 Hz
                                     #   全行程 0.065↔0.100 m（35 mm）用时 70 ms，跨越约 14 个下发帧，
                                     #   不会出现"一帧跳变"，也不会慢到跟不上遥控节拍。
                                     #   斜坡本身通过 VMC 足端速度前馈 (0, ±rate) 传给 kd_y，不再被阻尼拖住。

    # ---------------- 轮子速度分配（/wheel_target，仅供仿真与调试观测） ----------------
    # 固件 wheel_control_task 已是"纯力矩直通"（无位置/速度环，task.c 只读 wheel[].torque），
    # 所以 /wheel_target 的 ω 在实机上不参与执行，只有 sim_bridge 还拿它做速度环参考。
    #   平衡分量 = LQR 力矩 u × balance_torque_to_omega（一阶漏积分平滑）
    #   差速分量 = (v_des ∓ 0.5·L·ω_des) / r，再各自夹到 max_drive_omega
    # 实机执行力矩见下面 wheel_torque_enable 段。
    max_linear_velocity: 1.0         # 车体线速度 v 限幅 [m/s]
    max_yaw_rate: 1.0                # 车体偏航角速度 ω 限幅 [rad/s]：原地转向靠横向蹭地，
                                     #   I_zz≈0.005~0.01 kg·m²，2 N·m 净力矩就是 200~400 rad/s²，
                                     #   指令给太大只会打滑 + 陀螺噪声放大。1.0 rad/s 留够余量。
                                     #   仿真 launch 覆盖成 0.20（12.13 实测已接近摩擦极限）
    wheel_separation: 0.305          # 轮距 L [m]（URDF 两轮 y = ±0.1525；按轮胎接地中心线量约 0.297）
    max_wheel_omega: 20.0            # 单轮角速度总限幅 [rad/s]（平衡 + 行驶）
    max_balance_omega: 8.0           # 平衡分量限幅 [rad/s]
    max_drive_omega: 12.0            # 行驶 / 转向分量限幅 [rad/s]：留出平衡余量（合计受
                                     #   max_wheel_omega 约束）。12 rad/s × r=0.030 ≈ 0.36 m/s，
                                     #   想跑更快就同时加大 max_linear_velocity 与这一项
    # LQR 的力矩型输出 → 轮速目标的折算系数 [rad/s per N·m]：
    # 只在仿真（sim_bridge 用 /wheel_target 做速度环）里有意义，实机不生效
    balance_torque_to_omega: 20.0
    balance_leak_rate: 60.0          # 平衡轮速指令一阶低通系数 [1/s]（越大跟随越快，越小越柔）

    # ---------------- 轮子力矩通道（实机主通道，必须开） ----------------
    # 固件是纯力矩直通：帧里 wheel[i].torque × WHEEL_COUNTS_PER_NM → M2006 电流。
    # 关掉它 = 帧里 torque 恒 0 = 实机轮子完全不出力（腿能动、轮子不动）。
    wheel_torque_enable: true        # false = /wheel_torque 恒为 0；true = 力矩直通（实机必须 true）
    wheel_torque_max: 0.40  # [test override]
                                     #   取 1.0 让平衡（≤1.0）、差速、偏航三者共用同一预算。
                                     #   原地转向突破力矩 ≈ μ·N·L/2 ≈ 0.6×22.5×0.153 ≈ 2.1 N·m，
                                     #   左右反相 ±1.0 正好给出 2.0 N·m 差模，压在阈值上→必须靠积分补齐。
    k_vel_p: 1.0                     # 线速度误差 P [N·m per (m/s)]，左右同相：0.1 m/s 误差 → 0.1 N·m
    k_yaw_p: 0.15  # [test override]
                                     #   单轮 1.2 N·m、差模 2.4 N·m > 2.1 N·m 摩擦阈值，能真正转起来
    yaw_ff: 0.06  # [test override]
                                     #   单独 0.06 在 1 rad/s 时只有 1.2 N·m 差模 0.12，破不了静摩擦
    k_vel_i: 0.0                     # 线速度积分 [N·m per (m/s) per s]（补静摩擦死区），限幅 ±0.5·wheel_torque_max
    k_yaw_i: 0.0  # [test override]
                                     #   限幅 ±wheel_torque_max（差模 ±2.0 N·m）；代价是打滑时会 windup
    wheel_brake_damp: 0.02           # 非平衡态（未使能 / FAULT）阻尼制动 [N·m/(rad/s)]，τ = -k·ω
                                     #   固件没有位置环，锁不住轮子：坡上会缓慢溜车，想锁死要另加轮速闭环

    # ---------------- 安全门限（状态机见 control_state.hpp） ----------------
    imu_timeout: 0.10                # IMU 数据年龄上限 [s]，超过置 kFaultImu
    joint_state_timeout: 0.10        # 关节反馈年龄上限 [s]，超过置 kFaultJointState
    wheel_state_timeout: 0.10        # 轮速/轮角反馈年龄上限 [s]，超过置 kFaultWheelState
    command_timeout: 0.30            # 上层命令超时 → DEGRADED（停速度、保平衡）[s]
    command_fault_timeout: 1.00      # 上层命令长期丢失 → FAULT（关节失力、轮子保持）[s]
    max_pitch: 0.35                  # |pitch| 上限 [rad]（约 20°），超过置 kFaultAttitude
    max_pitch_rate: 3.00             # |pitch_dot| 上限 [rad/s]，超过置 kFaultAttitude
                                     # 正常站立实测 |pitch|≤0.02、|pitch_dot|≤0.2，启动瞬态最大约 0.17 rad；
                                     # 姿态回到限内且角速度收敛后会自动重新起控（不需手动 enable）
    startup_cycles: 250              # 进入 RUN 前需连续健康的周期数（500 Hz 下 0.5 s）

    # ---------------- 话题 ----------------
    imu_topic: imu/data              # IMU 话题（订阅）
    odom_topic: odom                 # 里程计话题（leg_control 发布）
    joint_states_topic: joint_states # 关节状态话题（订阅，2 轮 + 4 关节）
    command_topic: robot_command     # 上层命令话题（订阅）
    joint_target_topic: joint_target # 腿关节目标话题（发布，effort = 力矩）
    wheel_target_topic: wheel_target # 轮速目标话题（发布，[ω_L, ω_R]）
    leg_joint_names: [lf_joint1, lb_joint1,
                      rf_joint1, rb_joint1]  # 4 个驱动髋 [左前, 左后, 右前, 右后]（顺序对应力矩）
    wheel_joint_names: [lefoot_joint, rifoot_joint]              # 2 个轮关节名

# 上层指令参数服务：rqt_reconfigure / ros2 param 动态修改后发布 /robot_command。
command_param:
  ros__parameters:
    # =========================================================================
    # 第一部分：启动配置与安全限幅（通常在节点启动加载，属于基础安全边界）
    # =========================================================================
    command_topic: robot_command     # [话题] 上层指令发布的 ROS2 话题名称，底盘控制器将订阅此话题获取控制流
    publish_rate: 50.0               # [频率] 指令发布频率 [Hz]（50 Hz 既能保证指令平滑连续，又不会造成总线堵塞）
    max_linear: 1.0                  # [限幅] 车体最大线速度硬限幅 [m/s]，防止遥操作时速度给过大导致失控跑偏
    max_yaw: 1.0                     # [限幅] 车体最大偏航角速度（转向速率）硬限幅 [rad/s]：
                                     #   与 leg_control 的 max_yaw_rate 保持一致；原地偏航靠横向蹭地，
                                     #   指令超过 1 rad/s 只会打滑、让 gyro z 的反馈噪声放大
    com_height_min: 0.065            # [限幅] 质心高度安全下限 [m]，防止腿过分收缩导致机构产生机械干涉或触底
    com_height_max: 0.100            # [限幅] 质心高度安全上限 [m]，防止腿伸得太直逼近奇异位形（约 90% 行程）
    max_pitch_target: 0.30           # [限幅] 目标 Pitch 角最大绝对值 [rad]（约 11.5°），防止指令过大导致机器人倾覆
    cmd_vel_topic: cmd_vel           # [话题] 上层速度命令（geometry_msgs/Twist），只取 linear.x / angular.z；
                                     #   收到即切 TELEOP（仍需 enable=true），比参数更适合导航/遥控程序连续发
    use_cmd_vel: true                # [开关] 是否订阅 cmd_vel；关掉就只能用 linear_velocity / yaw_rate 参数给速度
    cmd_vel_timeout: 0.5             # [安全] 超过该时间没有新 cmd_vel 就把速度归零 [s]，防止上层掉线后机器人继续跑
    max_linear_accel: 0.30           # [斜坡] 线速度指令跟踪加速度上限 [m/s²]；力矩型平衡环对速度阶跃很敏感，必须限加速
    max_yaw_accel: 3.0               # [斜坡] 偏航角速度指令跟踪角加速度上限 [rad/s²]：
                                     #   原地转向的净力矩 2 N·m 对应 200~400 rad/s²，指令斜坡设 1.0
                                     #   会让"想转"到"真转"拖 1 s；3.0 与执行能力同量级，50 Hz 发布下每帧 0.06 rad/s

    # =========================================================================
    # 第二部分：动态运行指令（支持通过 rqt_reconfigure / ros2 param set 实时动态修改）
    # =========================================================================
    enable: true                     # [总开关] 控制器总使能：
                                     #   - false = ZERO 状态（下发零力矩，电机卸力/失能）
                                     #   - true  = 使能平衡与控制（具体行为由 teleop 状态决定）
                                     
    teleop: true                     # [模式选择] 操作模式切换：
                                     #   - true  (且 enable=true) = TELEOP（遥操作模式，响应线速度与角速度指令）
                                     #   - false (且 enable=true) = STAND  （原地站立模式，忽略速度指令，在原地维持平衡）
                                     
    estop: false                     # [急停开关] 软件紧急停止：
                                     #   - true  = 触发急停，立即切断控制输出
                                     #   - 注意：若要从急停状态恢复，必须先将 enable 设为 false，解除 estop 后重新使能
                                     
    linear_velocity: 0.0             # [运动指令] 目标车体线速度 [m/s]，仅在 teleop: true 时生效：
                                     #   - 正数表示向前行驶，负数表示向后倒车
                                     
    yaw_rate: 0.0                    # [运动指令] 目标偏航角速度 [rad/s]，仅在 teleop: true 时生效：
                                     #   - 正数表示向左原地旋转，负数表示向右原地旋转
                                     
    com_height: 0.0834               # [姿态指令] 目标质心高度 [m]（建议与 leg_control 中的 com_height_default 保持一致）：
                                     #   - 动态微调该值可控制机器人整体“下蹲”或“起立”（必须在 min/max 范围内）
                                     
    pitch_target: 0.0                # [姿态指令] 目标 Pitch 倾角偏置 [rad]：
                                     #   - 动态修改此值可让机器人主动向前倾（正数）或向后仰（负数）
