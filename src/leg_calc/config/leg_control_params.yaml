# =============================================================================
# wheel_leg 平衡控制器参数（leg_control，500 Hz 统一控制环）
#
# 每 2 ms 完成下面 6 件事，本文件按同样顺序分节，改动哪一环就找对应小节：
#
#   ① 状态快照   /imu/data(pitch) + /joint_states(4 关节 + 2 轮) → 四状态 [x, θ, ẋ, θ̇]
#   ② 安全状态机 INIT → RUN / DEGRADED / FAULT，任何反馈超时立刻降级（不失力）
#   ③ 姿态 LQR   四状态在线 LQR，输出**总轮轴力矩** u（增益随腿长 h 调度）
#   ④ 腿 VMC     五杆足端弹簧-阻尼：撑住机身 + 跟踪腿长，含重力前馈与足端速度前馈
#   ⑤ 轮子分配   τ_L/τ_R = u/2（平衡）+ 速度P（同相）∓ 偏航P（反相），最后统一限幅
#   ⑥ 下发       /joint_target(effort) + /wheel_torque → usb_drive 250 Hz 打包 → 固件
#
# 固件（stm32/one/task/task.c）是**纯力矩直通**：只读 wheel[].torque × 4550 → M2006 电流，
# 没有位置环/速度环。所以本文件里所有"力矩"参数直接决定轮子出力，不存在内环兜底。
#
# 调参顺序：③ 的 Q/R（平衡刚度）→ ⑤ 的 k_vel_p（速度抑制强度）→ ④ 的 kp/kd（机身硬度）。
# 一次只动一组，改完看 /leg_control/state 的 u、ẋ、θ̇ 与 /wheel_torque 是否还饱和。
# =============================================================================
leg_control:
  ros__parameters:
    # =========================================================================
    # ① 控制环节拍与线程调度
    #    功能：把上面 6 步固定跑在 2 ms 周期上；实时线程避免被系统任务抢占
    # =========================================================================
    control_rate: 500.0              # 控制环频率 [Hz]（周期 2 ms）
    debug_rate: 100.0                # 调试类输出频率 [Hz]：/odom + TF + /leg_control/state
                                     #   控制环仍跑 500 Hz；这三条若也按 500 Hz 发布，会把单线程
                                     #   executor 和订阅端（rviz2 / topic echo）拖垮，日志表现为
                                     #   “控制环最坏执行时间 xx ms 超过 2 ms 周期”。0 = 不发布

    # 功能：SCHED_FIFO 实时线程。普通 CFS 线程被同机编译/IDE/浏览器抢时间片就是 ms~十 ms 抖动，
    #   一次 >100 ms 的抖动会让 IMU/关节/轮反馈同时超时 → 故障字 0x23 停机。
    rt_priority: 60                  # SCHED_FIFO 优先级（1~99）；0 = 不用 FIFO。
                                     #   需要 CAP_SYS_NICE：sudo setcap cap_sys_nice+ep <可执行文件>
                                     #   或 /etc/security/limits.conf 加 "<user> - rtprio 80"
    rt_nice: -10                     # SCHED_FIFO 不可用时的退路（per-thread nice，0 = 不调）；
                                     #   同样需要权限，失败只打一条 WARN，不影响运行

    # =========================================================================
    # ② 机器人物理参数（LQR 模型用）
    #    功能：提供四状态线性化所需的 M / m / h / I / r / Jw
    #    全部由 src/model/model/wheel_leg.urdf 在 home 姿态推导。
    #    home 取 MJCF keyframe "home"：两轮轴等高（差 0.15 mm）的站立零位；
    #    URDF 关节零位左右不对称，home 时右腿并非全零（rf1=-0.2259, rf2=0.3339），
    #    直接用 q=0 会把轮轴高度算成 0.0254、h 偏大到 0.0895。
    # =========================================================================
    cart_mass: 0.290                 # M：两轮质量之和 [kg]（lefoot 0.130114 + rifoot 0.155050）
    pendulum_mass: 2.004             # m：腿 + 机身（摆杆）质量 [kg]（base 1.667452 + 4 曲柄 + 4 连杆）
    com_length: 0.0353               # h：home 姿态摆杆质心到轮轴距离 [m]
                                     # 2026-11-01 换 URDF 零位后实测：质心 z 0.06621 − 轮轴 z 0.031909
                                     # （旧零位 0.0834 是"深蹲前"的值，站立靠 com_height 指令把腿撑开）
    com_inertia: 0.001793            # I：摆杆绕自身质心 pitch 惯量 [kg·m²]（绕轮轴 4.033e-3 − m·h²）
    gravity: 9.81                    # g：重力加速度 [m/s²]
    wheel_radius: 0.031              # r：轮半径 [m]（接触圆柱 0.032；两轮静态高度差 3.98 mm）
    wheel_inertia: 0.0000421         # Jw：两轮绕轮轴等效转动惯量 [kg·m²]（MJCF 两轮 Iyy 之和）
    input_mode: wheel_torque         # 控制输入定义：wheel_torque（轮轴力矩 N·m）/ force（轮轴等效力 N）
                                     #   固件是力矩直通，实机必须用 wheel_torque

    # =========================================================================
    # ③ 姿态 LQR（本控制器的核心功能）
    #    加了什么：四状态全状态反馈，输出**总轮轴力矩** u；增益随实测腿长 h 在线调度
    #    状态量来源（已逐项核对）：
    #      x  = 0.5·(angle_L + angle_R)·r   轮端多圈绝对转角 × 轮半径 [m]，正 = 前进
    #      ẋ  = 0.5·(w_L + w_R)·r           轮端角速度 × 轮半径 [m/s]（固件已 ÷36、乘 dir）
    #      θ  = IMU 四元数 ZYX → pitch − theta_offset [rad]，正 = 前倾
    #      θ̇  = IMU angular_velocity.y [rad/s]，与 θ 同轴
    #
    #    位置参考 x_ref 由控制核心管理（不能直接锚在 0）：
    #      * 首次进入平衡时锚定在当前轮端位置；
    #      * 有行驶指令时按指令速度积分（位置误差 = 跟踪滞后）；
    #      * 停车后冻结，位置项把残余溜车刹住。
    #    实测教训：只留 k_x_dot、去掉 x 项会变成正反馈（0.1 m/s 指令冲到 0.4 m/s）。
    #
    #    u 的物理含义：**两轮合力矩**。computeWheelTorques 里按 u/2 分给左右，
    #    与模型 inputMatrix（Bq = 1/r）一致，所以 u_max 也要按"总量"填。
    # =========================================================================
    q_diag: [50.0, 700.0, 10.0, 2.0]  # Q 对角：[x, θ, ẋ, θ̇]。θ 越大姿态越硬；
                                      #   θ̇ 项提供阻尼（太大会让力矩被角速度噪声主导）
    r_weight: 13.75                  # R：越小越硬。当前解出 K=[-1.91,-9.18,-2.01,-0.62]，
                                     #   u_max=0.78 时饱和角 4.9°（摆动机身全程在线性区）
                                     # 反例（2026-11-04 现场踩过）：Q=[150,2050,40,20]/R=1.05
                                     #   → K_θ=58.3，饱和角 0.88°，u 逐帧在 ±0.9 间翻转（bang-bang）
    gain_mode: online_lqr            # online_lqr：每周期按 h 求解 Riccati（缓存阈值 2 mm）；
                                     # quadratic：用下面 k_coeffs 的常数增益（更快，但不随 h 变）
    k_coeffs: [                      # 仅 quadratic 模式使用，保留作对照
      0.0, 0.0, -1.18,               #   行 = [k_x, k_theta, k_x_dot, k_theta_dot]
      0.0, 0.0, -5.22,               #   列 = [h² 系数, h 系数, 常数项]
      0.0, 0.0, -1.17,
      0.0, 0.0, -0.33
    ]

    # =========================================================================
    # ③-a 腿长 h 的测量（LQR 增益调度的输入）
    #    功能：用关节角 FK 实时算质心高度 h = 足端_y + com_offset，替代固定名义值
    # =========================================================================
    thigh: 0.15                      # [参考] 串联模型大腿长度 [m]（主链路已用五杆，仅单测用）
    shank: 0.15                      # [参考] 串联模型小腿长度 [m]（同上）
    com_offset: -0.0289              # home 姿态质心在髋轴下方 [m]（2026-11-01 实测：髋 z 0.09514 − 质心 z 0.06621）
    h_min: 0.06                      # 增益调度下限 [m]（低于此按 0.06 取增益）
    h_max: 0.12                      # 增益调度上限 [m]（h∈[0.06,0.12] 内 K 变化 <3%）
    use_measured_height: true        # true = 用关节角实测 h；false = 恒用 com_length 名义值
    height_timeout: 0.50             # 关节反馈年龄超过该值就退回 com_length [s]

    # =========================================================================
    # ③-b Pitch 姿态来源与力矩限幅
    #    功能：确定 θ 取哪根轴、零位偏置，以及平衡力矩的总量上限
    # =========================================================================
    theta_axis: pitch                # 姿态轴：pitch / roll（对应 IMU 的 rpy 分量与陀螺轴）
    theta_offset: 0.0                # IMU 安装零位 [rad]：静置时 state[2] 若不是 0，把该值填进来
    u_max: 0.78                      # 平衡力矩上限 [N·m，**两轮合计**]，左右各 0.39。
                                     #   0.39 ≈ 轮地静摩擦 μ·N·r，再大只会打滑（实测 0.90 →
                                     #   /wheel_torque 恒顶在 0.40，有效力矩反而下降）
                                     #   固件能力 3.56 N·m/轮，这里留足差速与偏航余量

    # =========================================================================
    # ④ 五杆腿 VMC（撑住机身 + 跟踪腿长）
    #    加了什么：足端二维弹簧-阻尼 + 重力前馈 m·g/2 + 足端速度前馈 (0, ±com_height_rate)
    #    运动学：五杆闭链，正解取 foot_branch，逆解取 front/rear_branch
    # =========================================================================
    l1: 0.050                        # O→A 前摆臂 [m]（URDF |lf_joint1→lf_joint2| = 0.0500）
    l2: 0.105                        # A→B 前连杆 [m]（URDF 平面投影 0.1050）
    l3: 0.105                        # C→B 后连杆 [m]（URDF |C-B| = 0.1052，取标称 0.105）
    l4: 0.050                        # D→C 后摆臂 [m]（URDF |lb_joint1→lb_joint2| = 0.0500）
    l5: 0.060                        # O→D 两髋间距 [m]（URDF 前后髋 origin x 差 0.060000）
    foot_branch: 1                   # 正解装配分支：+1 足端在 A→C 连线下方，-1 取上方
    front_branch: 1                  # 逆解前肘分支：+1 前肘 A 在 O→B 左侧，-1 取右侧
    rear_branch: 1                   # 逆解后肘分支：+1 后肘 C 在 D→B 右侧，-1 取左侧

    # kp/kd 按 ζ = kd / (2·√(kp·m_eq)) 配对（m_eq 取单腿等效质量 ≈ 0.56 kg），
    # 这一对决定"机身被推一下回得多快、会不会晃"：
    kp_x: 350.0                      # 足端前后刚度 [N/m]：越大前后越"顶得住"，太大易激振
    kp_y: 2800.0                     # 足端上下刚度 [N/m]：撑住整机重量（带宽 ≈8 Hz）；再大接近"硬杆"
    kd_x: 24.0                       # 足端前后阻尼 [N·s/m]（与 kp_x 配对 ζ≈0.86）
    kd_y: 74.0                       # 足端上下阻尼 [N·s/m]（与 kp_y 配对 ζ≈0.94，顺带压住俯仰注入）
    force_max_x: 60.0                # 足端前后力限幅 [N]，<=0 表示该轴不限
    force_max_y: 150.0               # 足端上下力限幅 [N]：重力前馈 ~9.3 N + 弹簧量，余量充足
    vmc_gravity_comp: true           # 重力前馈：足端加 m·g/2（经 Jᵀ），消除静态下蹲 mg/(2kp_y)≈3.3 mm
    foot_target_x: 0.0314            # 足端前后目标 [m]（两髋中点 l5/2=0.03，按新零位实测 0.0314）
    joint_torque_max: 8.0            # 单关节力矩限幅 [N·m]（RobStride 能力范围内）
    joint_torque_sign: [1.0, 1.0, 1.0, 1.0]  # 四关节力矩符号 [左髋, 左膝, 右髋, 右膝]，方向反了改 -1

    # 关节角 → 五杆角标定：α/β = joint_sign·q + joint_offset（顺序：左前 α、左后 β、右前 α、右后 β）
    #   曲柄零位不指向 +x，必须补偿：α_L(0)=123.499°、β_L(0)=34.312°、α_R(0)=119.868°、β_R(0)=55.617°
    #   右腿整体绕 x 轴转 180°，关节轴反向，所以 joint_sign 取 -1
    #   来源：MuJoCo 里量 曲柄髋心→肘心 的平面方向（q=0 与 q=±0.4 线性拟合，斜率 ±1），
    #   残差 1e-3 度；标定后 FK 复算足端与模型差 < 0.3 mm（teach.md 12.7）
    #   换 CAD / 换减速器零位后这 8 个数要重测
    joint_sign: [1.0, 1.0, -1.0, -1.0]
    joint_offset: [-3.0285, -0.1911, -3.0411, -0.1293]  # [rad]
    # 2026-11-01 按新 URDF 零位（lf1 rpy -1.1、lb1 rpy +0.79、rf1 -1.15、rb1 +1.1）重标定；
    # 旧值：[2.155471, 0.598858, 2.092103, 0.970701]

    # =========================================================================
    # ④-a 目标质心高度（腿长的"指令"环节）
    #    功能：把上层 com_height 指令做斜坡，再换算成 VMC 足端目标 foot_y = h − com_offset
    #    工作空间：foot_x≈0.031 时 foot_y∈[0.046, 0.152] → h∈[0.017, 0.123]
    #    home 姿态（关节全 0）是深蹲 h=0.0343，站立靠下面的指令把腿撑开
    # =========================================================================
    com_height_default: 0.0834       # 默认站立目标（换算 foot_y = 0.1123 m，实测 h≈0.0837）
    com_height_min: 0.075            # 下限：foot_y 0.1039（再往下五杆雅可比变差，实测 0.065 会摔倒）
    com_height_max: 0.100            # 上限：foot_y 0.1289（约 90% 行程，避开曲柄共线奇异）
    com_height_rate: 0.10            # 腿长斜坡 [m/s]：0.50 时 35 mm 台阶只要 70 ms，
                                     #   机身竖直加速度 > g、轮子瞬时卸载 → 姿态被顶翻；
                                     #   0.10 时 350 ms 走完全行程（500 Hz → 0.2 mm/周期）
                                     #   斜坡值同时作为 VMC 足端速度前馈 (0, ±rate) 传给 kd_y，
                                     #   否则 kd_y 会把"目标在动"当成误差反向阻尼，腿又慢又抖

    # =========================================================================
    # ⑤ 轮子分配：平衡 + 速度 + 偏航
    #    功能：把 LQR 的总力矩 u 与速度/偏航反馈合成左右轮力矩
    #      τ_L = u/2 + k_vel_p·(v_des−ẋ) − τ_yaw
    #      τ_R = u/2 + k_vel_p·(v_des−ẋ) + τ_yaw
    #    限幅：单轮 |τ| ≤ wheel_torque_max；u 本身先被 u_max 限住
    # =========================================================================
    max_linear_velocity: 1.0         # 车体线速度指令限幅 [m/s]
    max_yaw_rate: 1.0                # 车体偏航角速度指令限幅 [rad/s]：原地转向靠横向蹭地，
                                     #   I_zz≈0.005~0.01，2 N·m 净力矩就是 200~400 rad/s²，
                                     #   指令给太大只会打滑 + 陀螺噪声放大
                                     #   仿真 launch 覆盖成 0.10（物理上限约 0.1 rad/s）
    wheel_separation: 0.304          # 轮距 L [m]（URDF 两轮 y=±0.1525；按轮胎接地中心线约 0.297）
    max_wheel_omega: 20.0            # 单轮角速度总限幅 [rad/s]（平衡 + 行驶，仿真通道用）
    max_balance_omega: 8.0           # 平衡分量限幅 [rad/s]（仿真通道用）
    max_drive_omega: 12.0            # 行驶/转向分量限幅 [rad/s]（仿真通道用；12×r≈0.36 m/s）

    # 仿真通道：/wheel_target 的平衡分量 = u × balance_torque_to_omega（一阶漏积分平滑）。
    # 实机固件不读 /wheel_target（纯力矩直通），这里只影响 sim_bridge。
    balance_torque_to_omega: 10.0    # u 是总力矩后数值翻倍，系数同比减半保持仿真等效
    balance_leak_rate: 120.0         # 一阶低通系数 [1/s]：60 → 16.7 ms（9.5 Hz，纯延迟）；
                                     #   120 → 8.3 ms（19 Hz），响应快一倍，
                                     #   仍高于腿/俯仰谐振（~10 Hz 的阻尼由 kd_y 提供，实测不激振）
                                     #   该低通同时作用于实机 /wheel_torque（抑制 10 Hz 谐振激励）

    # =========================================================================
    # ⑤-a 轮子力矩通道（实机主通道，必须开）
    #    功能：/wheel_torque → 帧里 wheel[i].torque → 固件 × 4550 → M2006 电流
    #    关掉它 = 帧里 torque 恒 0 = 腿能动、轮子完全不出力
    # =========================================================================
    wheel_torque_enable: true        # false = /wheel_torque 恒为 0；true = 力矩直通（实机必须 true）
    wheel_torque_max: 0.40           # **单轮**力矩限幅 [N·m]：平衡、差速、偏航共用同一预算。
                                     #   轮地静摩擦 ≈0.39，取 0.40 刚好在阈值内；1.0 会持续打滑
    k_vel_p: 1.0                     # 线速度误差 P [N·m per (m/s)]，左右同相（单轮系数）
                                     #   注意：LQR 里也有速度项，两者相加不宜过大（实测 total>2.2 失稳）
    k_yaw_p: 0.15                    # 偏航角速度误差 P [N·m per (rad/s)]，左右反相（单轮系数）
                                     #   1.2 时零指令下会把陀螺噪声放大成 ±0.5 N·m 差模，轮子擦滑
    yaw_ff: 0.03                     # 偏航前馈 [N·m per rad/s]：只提前给一点，>0.07 会激振俯仰
    k_vel_i: 0.0                     # 线速度积分 [N·m per (m/s) per s]（补静摩擦死区），限幅 ±0.5·wheel_torque_max
    k_yaw_i: 0.0                     # 偏航积分：原地转向静摩擦→滑动切换会 windup，
                                     #   实测开启后一脱粘就以数倍力矩冲出去（teach 12.13 ③）
    wheel_brake_damp: 0.05           # 非平衡态（未使能 / FAULT）阻尼制动 [N·m/(rad/s)]，τ = −k·ω
                                     #   固件没有位置环，锁不住轮子：坡上会缓慢溜车

    # =========================================================================
    # ②-a 安全门限（状态机见 control_state.hpp）
    #    功能：任何一路反馈超时或姿态越界 → 降级/停机，宁可失力也不乱动
    # =========================================================================
    imu_timeout: 0.10                # IMU 数据年龄上限 [s]，超过置 kFaultImu
    joint_state_timeout: 0.10        # 关节反馈年龄上限 [s]，超过置 kFaultJointState
    wheel_state_timeout: 0.10        # 轮速/轮角反馈年龄上限 [s]，超过置 kFaultWheelState
    command_timeout: 0.30            # 上层命令超时 → DEGRADED（停速度、保平衡）[s]
    command_fault_timeout: 1.00      # 上层命令长期丢失 → FAULT（关节失力、轮子保持）[s]
    max_pitch: 0.35                  # |pitch| 上限 [rad]（约 20°），超过置 kFaultAttitude
    max_pitch_rate: 3.00             # |pitch_dot| 上限 [rad/s]，超过置 kFaultAttitude
                                     #   正常站立 |pitch|≤0.02、|pitch_dot|≤0.2，启动瞬态约 0.17 rad；
                                     #   姿态回限内且角速度收敛后自动重新起控（不需手动 enable）
    startup_cycles: 250              # 进入 RUN 前需连续健康的周期数（500 Hz 下 0.5 s）

    # =========================================================================
    # ⑥ 话题
    # =========================================================================
    imu_topic: imu/data              # IMU 话题（订阅）
    odom_topic: odom                 # 里程计话题（leg_control 发布）
    joint_states_topic: joint_states # 关节状态话题（订阅，2 轮 + 4 关节）
    command_topic: robot_command     # 上层命令话题（订阅）
    joint_target_topic: joint_target # 腿关节目标话题（发布，effort = 力矩）
    wheel_target_topic: wheel_target # 轮速目标话题（发布，[ω_L, ω_R]，仿真/观测用）
    leg_joint_names: [lf_joint1, lb_joint1,
                      rf_joint1, rb_joint1]  # 4 个驱动髋 [左前, 左后, 右前, 右后]（顺序对应力矩）
    wheel_joint_names: [lefoot_joint, rifoot_joint]  # 2 个轮关节名

# =============================================================================
# 上层指令服务（command_param）：rqt_reconfigure / ros2 param set 改完即发布 /robot_command
#   - 第一部分是启动期就确定的安全边界，第二部分是运行中可实时改的运动/姿态指令
# =============================================================================
command_param:
  ros__parameters:
    # ------------------------- 启动配置与安全限幅 -------------------------
    command_topic: robot_command     # [话题] 指令发布话题，leg_control 订阅该话题
    publish_rate: 50.0               # [频率] 指令发布频率 [Hz]（50 Hz 平滑且不压总线）
    max_linear: 1.0                  # [限幅] 车体最大线速度 [m/s]，防止遥操作给太大导致失控
    max_yaw: 1.0                     # [限幅] 车体最大偏航角速度 [rad/s]：与 leg_control 的
                                     #   max_yaw_rate 保持一致；超过 1 rad/s 只会打滑、放大 gyro z 噪声
    com_height_min: 0.075            # [限幅] 质心高度下限 [m]：再往下五杆折叠过深、VMC 雅可比变差
    com_height_max: 0.100            # [限幅] 质心高度上限 [m]：防止腿伸太直逼近奇异位形（约 90% 行程）
    max_pitch_target: 0.30           # [限幅] 目标 Pitch 角最大绝对值 [rad]（约 17°），防止指令过大倾覆
    cmd_vel_topic: cmd_vel           # [话题] 上层速度命令（geometry_msgs/Twist），只取 linear.x / angular.z
                                     #   收到即切 TELEOP（仍需 enable=true），适合导航/遥控连续发
    use_cmd_vel: true                # [开关] 是否订阅 cmd_vel；关掉则只能用 linear_velocity / yaw_rate 参数
    cmd_vel_timeout: 0.5             # [安全] 超过该时间没有新 cmd_vel 就把速度归零 [s]
    max_linear_accel: 0.15           # [斜坡] 线速度指令跟踪加速度上限 [m/s²]：0.30 时 0.1 m/s 阶跃
                                     #   会激起 max_pitch_rate 故障；0.15 平稳
    max_yaw_accel: 3.0               # [斜坡] 偏航角速度指令跟踪角加速度上限 [rad/s²]：
                                     #   原地转向净力矩 2 N·m 对应 200~400 rad/s²，设 1.0 会拖 1 s；
                                     #   3.0 与执行能力同量级（50 Hz 下每帧 0.06 rad/s）

    # ------------------------- 动态运行指令（可实时改） -------------------------
    enable: true                     # [总开关] false = ZERO（零力矩、电机卸力）；true = 正常控制
    teleop: true                     # [模式] true = TELEOP（响应速度指令）；false = STAND（原地站立）
    estop: false                     # [急停] true = 立即切断输出；恢复需先把 enable 置 false 再重新使能
    linear_velocity: 0.0             # [运动] 目标线速度 [m/s]，仅 teleop=true 生效（正=前进）
    yaw_rate: 0.0                    # [运动] 目标偏航角速度 [rad/s]，仅 teleop=true 生效（正=左转）
    com_height: 0.0834               # [姿态] 目标质心高度 [m]（建议与 com_height_default 一致）
                                     #   动态微调可让机器人"下蹲/起立"，必须在 min/max 内
    pitch_target: 0.0                # [姿态] 目标 Pitch 偏置 [rad]：正=主动前倾，负=后仰
